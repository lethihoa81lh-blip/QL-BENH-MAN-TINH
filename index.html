<script type="module">
  // ===== Firebase setup =====
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzORIi4PXbYT993dGO_37DUR0xG2qlR-U",
    authDomain: "ql-benh-man-tinh.firebaseapp.com",
    projectId: "ql-benh-man-tinh",
    storageBucket: "ql-benh-man-tinh.firebasestorage.app",
    messagingSenderId: "1036151855833",
    appId: "1:1036151855833:web:078488cc0b07cf1e253cc8"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbDb = getFirestore(fbApp);
  const fbAuth = getAuth(fbApp);

  // Expose a small bridge so the classic (non-module) app script below can use Firestore.
  window.__fb = {
    ready: new Promise((resolve) => {
      onAuthStateChanged(fbAuth, (user) => {
        if (user) resolve();
      });
      signInAnonymously(fbAuth).catch((err) => {
        console.error("Firebase anonymous sign-in failed:", err);
        // Resolve anyway so the app can render an error state instead of hanging.
        resolve();
      });
    }),
    collection: () => collection(fbDb, "patients"),
    doc: (id) => doc(fbDb, "patients", id),
    addDoc, updateDoc, deleteDoc, onSnapshot,
  };
</script>
<style>
  :root{
    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --ink:#152625;
    --muted:#5B6E6B;
    --muted-2:#8A9B98;
    --border:#DEE6E4;
    --primary:#0E7C66;
    --primary-dark:#095F4E;
    --primary-tint:#E4F3EF;
    --mental:#6A4C93;
    --mental-tint:#F0EAF6;
    --bp:#1D6F8C;
    --bp-tint:#E6F1F5;
    --warn:#B7791F;
    --warn-tint:#FCF1DE;
    --danger:#C0392B;
    --danger-tint:#FBE8E5;
    --ok:#2F9E68;
    --shadow: 0 1px 2px rgba(21,38,37,0.06), 0 4px 14px rgba(21,38,37,0.05);
    --radius: 10px;
  }
  /* Theme is intentionally always light for readability on clinic devices. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'Times New Roman', Times, serif;font-size:15px;line-height:1.5;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 20px 56px;}

  /* Header */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(155deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow);}
  .brand-mark svg{width:22px;height:22px;}
  h1{font-family:'Times New Roman', Times, serif;font-weight:700;font-size:23px;margin:0;letter-spacing:-0.01em;}
  .brand-sub{color:var(--muted);font-size:12.5px;margin-top:1px;}
  .auth-box{display:flex;align-items:center;gap:10px;}
  .role-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;font-weight:500;box-shadow:var(--shadow);}
  .role-dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);}
  .role-pill.admin .role-dot{background:var(--primary);}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.12s ease;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.ghost:hover{background:var(--primary-tint);}
  .btn.danger-txt{color:var(--danger);}
  .btn.danger-txt:hover{background:var(--danger-tint);border-color:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn svg{width:14px;height:14px;flex-shrink:0;}

  /* Alerts (compact) */
  .alert-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;font-size:13px;}
  .alert-bar-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;}
  .alert-bar-label svg{width:15px;height:15px;color:var(--muted-2);flex-shrink:0;}
  .alert-chip{border:1px solid transparent;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .alert-chip:hover{filter:brightness(0.95);}
  .alert-chip.over{background:var(--danger-tint);color:var(--danger);}
  .alert-chip.due{background:var(--warn-tint);color:var(--warn);}
  .alert-chip.soon{background:var(--primary-tint);color:var(--primary-dark);}
  .status-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:13px;background:var(--primary-tint);color:var(--primary-dark);border:1px solid color-mix(in srgb, var(--primary) 30%, transparent);}
  .status-banner button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;padding:0;font-size:13px;}

  /* Stat strip (compact) */
  .stat-strip{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .stat-seg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 4px;border:none;border-right:1px solid var(--border);background:transparent;font-family:inherit;cursor:pointer;transition:.12s ease;min-width:0;}
  .stat-seg:last-child{border-right:none;}
  .stat-seg:hover{background:var(--bg);}
  .stat-seg:active{transform:translateY(1px);}
  .stat-seg-main{display:flex;align-items:baseline;gap:5px;}
  .stat-seg-num{font-size:17px;font-weight:800;font-family:'Times New Roman', Times, serif;line-height:1;color:var(--ink);white-space:nowrap;}
  .stat-seg-lbl{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-seg-sub{font-size:9.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .stat-seg.accent-ok .stat-seg-num{color:var(--ok);}
  .stat-seg.accent-warn .stat-seg-num{color:var(--warn);}
  .stat-seg.accent-danger .stat-seg-num{color:var(--danger);}

  /* Toolbar */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .search{position:relative;flex:1;min-width:180px;max-width:280px;}
  .search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13.5px;}
  .search input:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted-2);}
  .spacer{flex:1;}
  .filters-row{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px;}
  .filter-caption{font-size:10.5px;color:var(--muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding-left:2px;}
  .filter-group select{width:100%;}
  .actions-row{display:flex;gap:8px;align-items:center;}
  .select-filter{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;}
  .select-filter:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .export-options{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .export-opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);text-align:left;width:100%;}
  .export-opt:hover{border-color:var(--primary);background:var(--primary-tint);}
  .export-opt .opt-desc{font-size:12.5px;color:var(--muted);font-weight:500;}

  /* Table */
  .tbl-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:980px;border:1px solid var(--border);table-layout:fixed;}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:11px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  thead th:last-child{border-right:none;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle;font-size:13.5px;word-wrap:break-word;overflow-wrap:break-word;}
  tbody td:last-child{border-right:none;}
  /* balanced column widths, proportional to expected content */
  thead th:nth-child(1), tbody td:nth-child(1){width:4%;}
  thead th:nth-child(2), tbody td:nth-child(2){width:15%;}
  thead th:nth-child(3), tbody td:nth-child(3){width:6%;}
  thead th:nth-child(4), tbody td:nth-child(4){width:6%;}
  thead th:nth-child(5), tbody td:nth-child(5){width:13%;}
  thead th:nth-child(6), tbody td:nth-child(6){width:12%;}
  thead th:nth-child(7), tbody td:nth-child(7){width:5%;}
  thead th:nth-child(8), tbody td:nth-child(8){width:5%;}
  thead th:nth-child(9), tbody td:nth-child(9){width:10%;}
  thead th:nth-child(10), tbody td:nth-child(10){width:11%;}
  thead th:nth-child(11), tbody td:nth-child(11){width:9%;}
  thead th:nth-child(12), tbody td:nth-child(12){width:4%;}
  /* center all column content except the name column */
  thead th:not(:nth-child(2)){text-align:center;}
  tbody td:not(.name){text-align:center;}
  tbody td:not(.name) > span{display:inline-flex;justify-content:center;width:100%;}
  tbody td.name{text-align:left;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--primary-tint);}
  td.name{font-weight:600;}
  td.stt{color:var(--muted-2);font-variant-numeric:tabular-nums;}
  .badge-group{display:inline-flex;gap:4px;flex-wrap:wrap;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge.mental{background:var(--mental-tint);color:var(--mental);}
  .badge.bp{background:var(--bp-tint);color:var(--bp);}
  .badge.dm{background:#FDF0E5;color:#B5591E;}
  /* .badge.dm uses the light-mode colors defined above at all times. */
  .status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;}
  .status .dot{width:7px;height:7px;border-radius:50%;}
  .status.ok{color:var(--ok);} .status.ok .dot{background:var(--ok);}
  .status.soon{color:var(--primary);} .status.soon .dot{background:var(--primary);}
  .status.due{color:var(--warn);} .status.due .dot{background:var(--warn);}
  .status.over{color:var(--danger);} .status.over .dot{background:var(--danger);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .icon-btn{border:1px solid transparent;background:transparent;padding:6px;border-radius:7px;color:var(--muted);display:inline-flex;}
  .icon-btn:hover{background:var(--bg);color:var(--ink);}
  .icon-btn.del:hover{background:var(--danger-tint);color:var(--danger);}
  .icon-btn svg{width:15px;height:15px;}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:38px;height:38px;color:var(--muted-2);margin-bottom:10px;}
  .empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px;}
  .foot-note{padding:10px 16px;color:var(--muted-2);font-size:12px;border-top:1px solid var(--border);}
  .view-hint{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);}
  .view-hint svg{width:15px;height:15px;flex-shrink:0;color:var(--muted-2);}
  .view-hint .link{background:none;border:none;color:var(--primary-dark);font-weight:700;text-decoration:underline;font-size:13px;padding:0;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,25,24,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-sm{max-width:400px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:17px;font-family:'Times New Roman', Times, serif;font-weight:700;}
  .modal-body{padding:20px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{border:none;background:transparent;color:var(--muted);padding:4px;border-radius:6px;}
  .close-x:hover{background:var(--bg);color:var(--ink);}
  .close-x svg{width:18px;height:18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .field input, .field select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13.5px;font-family:inherit;}
  .field input:focus, .field select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .radio-row{display:flex;gap:14px;padding-top:2px;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink);}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:600;}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px;}
  .pw-row{display:flex;gap:8px;}
  .pw-row input{flex:1;}
  .err-txt{color:var(--danger);font-size:12.5px;min-height:16px;}
  .lock-note{display:flex;gap:8px;color:var(--muted);font-size:12.5px;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:14px;}
  .lock-note svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}

  @media (max-width:640px){
    .wrap{padding:12px 8px 40px;}
    header.top{gap:10px;}
    .stats{grid-template-columns:1fr 1fr;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .search{max-width:none;}
    .filter-group{flex:1 1 45%;min-width:0;}
    .actions-row{width:100%;flex-wrap:wrap;}
    .actions-row button{flex:1;justify-content:center;min-width:120px;}
    .form-grid{grid-template-columns:1fr;}
    .tbl-scroll{-webkit-overflow-scrolling:touch;}
    table{min-width:760px;}
    thead th, tbody td{padding:8px 6px;font-size:12.5px;}
    thead th{font-size:10.5px;}
    .icon-btn{padding:7px 8px;}
    .icon-btn svg{width:14px;height:14px;}
  }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
/* ============================= ICONS ============================= */
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>',

  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>',
};

/* ============================= STATE ============================= */
const ADMIN_PASSWORD = "123456";
let patients = [];
let dbReady = false;
let dbHandle = null;
let unsub = null;

let state = {
  isAdmin: (localStorage.getItem('cms_isAdmin') === '1'),
  category: 'all',      // all | mental | bp | dm
  nha: 'all',            // 'all' or a specific nha value
  khu: 'all',            // 'all' or a specific khu value
  status: 'ontrack',     // all | ontrack | soon | due | over
  search: '',
  modal: null,           // 'form' | 'delete' | 'login'
  editing: null,         // patient object being edited, or null for new
  deleteTarget: null,
  formError: '',
  loginError: '',
  importStatus: '',
};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
  if(!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
function fmtDate(s){
  const d = parseDate(s);
  if(!d) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function computeStatus(p){
  const t = parseDate(todayStr());
  const r = parseDate(p.ngayTaiKham);
  if(!r) return 'active';
  const diffDays = Math.round((r.getTime() - t.getTime()) / 86400000);
  if(diffDays < 0) return 'over';
  if(diffDays === 0) return 'due';
  if(diffDays === 1) return 'soon';
  return 'active';
}
function categoryLabel(c){
  return c === 'mental' ? 'Tâm thần' : c === 'dm' ? 'Tiểu đường' : 'Huyết áp';
}
function categoryBadgeClass(c){
  return c === 'mental' ? 'mental' : c === 'dm' ? 'dm' : 'bp';
}
function loaiArray(p){
  const l = p && p.loai;
  if(Array.isArray(l)) return l.filter(Boolean);
  if(typeof l === 'string' && l) return [l];
  return ['bp'];
}
function normalizeVN(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .toLowerCase();
}
function isoFromDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseAnyDate(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'number'){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d.getTime()) ? '' : isoFromDate(d);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}

/* ============================= DB WIRING (Firebase Firestore) ============================= */
let dbError = null;

async function initDb(){
  try{
    await window.__fb.ready;
    const col = window.__fb.collection();
    window.__fb.onSnapshot(col, (snap)=>{
      patients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      dbReady = true;
      dbError = null;
      render();
    }, (err)=>{
      console.error('Firestore error', err);
      dbError = 'Không thể kết nối tới Firestore. Kiểm tra lại quy tắc bảo mật (Rules) và cấu hình Firebase.';
      dbReady = true;
      render();
    });
  }catch(e){
    console.error('Firebase init failed', e);
    dbError = 'Không thể kết nối Firebase.';
    dbReady = true;
    render();
  }
}

async function savePatient(data, id){
  if(id){
    await window.__fb.updateDoc(window.__fb.doc(id), data);
  }else{
    await window.__fb.addDoc(window.__fb.collection(), data);
  }
}

async function deletePatient(id){
  await window.__fb.deleteDoc(window.__fb.doc(id));
}

/* ============================= DERIVED DATA ============================= */
function distinctNha(){
  const set = new Set(patients.map(p => (p.nha||'').trim()).filter(Boolean));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'vi'));
}

function distinctKhu(){
  const set = new Set(patients.map(p => (p.khu||'').trim()).filter(Boolean));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'vi'));
}

function filteredPatients(){
  const q = normalizeVN(state.search.trim());
  return patients
    .map(p => ({...p, _status: computeStatus(p)}))
    .filter(p => state.category === 'all' ? true : loaiArray(p).includes(state.category))
    .filter(p => state.nha === 'all' ? true : (p.nha||'').trim() === state.nha)
    .filter(p => state.khu === 'all' ? true : (p.khu||'').trim() === state.khu)
    .filter(p => {
      if(state.status === 'all') return true;
      if(state.status === 'ontrack') return p._status === 'active' || p._status === 'soon';
      if(state.status === 'upcoming') return p._status === 'due' || p._status === 'soon';
      if(state.status === 'soon') return p._status === 'soon';
      if(state.status === 'due') return p._status === 'due';
      if(state.status === 'over') return p._status === 'over';
      return true;
    })
    .filter(p => {
      if(!q) return true;
      const hay = normalizeVN(p.hoTen) + ' ' + normalizeVN(p.nha) + ' ' + normalizeVN(p.khu) + ' ' +
        (p.ngayKham||'') + ' ' + fmtDate(p.ngayKham) + ' ' +
        (p.ngayTaiKham||'') + ' ' + fmtDate(p.ngayTaiKham);
      return hay.toLowerCase().includes(q);
    })
    .sort((a,b) => {
      const da = parseDate(a.ngayTaiKham), db_ = parseDate(b.ngayTaiKham);
      if(!da && !db_) return 0;
      if(!da) return 1;
      if(!db_) return -1;
      return da - db_;
    });
}

function counts(){
  const all = patients.map(p => ({...p, _status: computeStatus(p)}));
  return {
    total: all.length,
    mental: all.filter(p=>loaiArray(p).includes('mental')).length,
    bp: all.filter(p=>loaiArray(p).includes('bp')).length,
    dm: all.filter(p=>loaiArray(p).includes('dm')).length,
    bpdm: all.filter(p=>loaiArray(p).includes('bp')||loaiArray(p).includes('dm')).length,
    ontrack: all.filter(p=>p._status==='active').length,
    soon: all.filter(p=>p._status==='soon').length,
    due: all.filter(p=>p._status==='due').length,
    over: all.filter(p=>p._status==='over').length,
  };
}

/* ============================= EXPORT ============================= */
function buildRows(list){
  return list.map((p, idx) => ({
    'STT': idx+1,
    'Họ và tên': p.hoTen || '',
    'Năm sinh': p.namSinh || '',
    'Giới tính': p.gioiTinh || '',
    'Chẩn đoán': loaiArray(p).map(categoryLabel).join(', '),
    'Thuốc': p.thuoc || '',
    'Nhà': p.nha || '',
    'Khu': p.khu || '',
    'Ngày khám': fmtDate(p.ngayKham),
    'Ngày tái khám': fmtDate(p.ngayTaiKham),
    'Trạng thái': p._status === 'over' ? 'Quá hạn tái khám' : p._status === 'due' ? 'Đến hẹn hôm nay' : p._status === 'soon' ? 'Sắp đến hẹn (ngày mai)' : 'Đang uống thuốc',
  }));
}

async function exportGroup(kind, nhaFilterArg, khuFilterArg){
  const nf = nhaFilterArg !== undefined ? nhaFilterArg : state.nha;
  const kf = khuFilterArg !== undefined ? khuFilterArg : state.khu;
  const all = patients.map(p => ({...p, _status: computeStatus(p)}))
    .filter(p => nf === 'all' ? true : (p.nha||'').trim() === nf)
    .filter(p => kf === 'all' ? true : (p.khu||'').trim() === kf);
  let list, filename, sheetName;
  const nhaSlug = nf === 'all' ? '' : ('_Nha-' + nf.replace(/[^\p{L}\p{N}]+/gu, '-'));
  const khuSlug = kf === 'all' ? '' : ('_Khu-' + kf.replace(/[^\p{L}\p{N}]+/gu, '-'));
  if(kind === 'mental'){
    list = all.filter(p => loaiArray(p).includes('mental'));
    filename = 'Danh_sach_Tam_than' + nhaSlug + khuSlug + '_' + todayStr() + '.xlsx';
    sheetName = 'Tâm thần';
  }else{
    list = all.filter(p => loaiArray(p).includes('bp') || loaiArray(p).includes('dm'));
    filename = 'Danh_sach_Huyet_ap_Tieu_duong' + nhaSlug + khuSlug + '_' + todayStr() + '.xlsx';
    sheetName = 'Huyet ap - Tieu duong';
  }
  list.sort((a,b)=> (a.hoTen||'').localeCompare(b.hoTen||'', 'vi'));
  const rows = buildRows(list);
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:24},{wch:9},{wch:9},{wch:24},{wch:22},{wch:14},{wch:10},{wch:12},{wch:13},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  try{
    const downloads = window.claude?.use ? await claude.use("downloads") : null;
    if(downloads){
      await downloads.save({filename, data: blob});
    }else{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      a.remove(); URL.revokeObjectURL(url);
    }
  }catch(e){
    if(e && e.code === 'declined') return;
    console.error('export failed', e);
    alert('Không thể xuất file. Vui lòng thử lại.');
  }
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

  const app = document.getElementById('app');
  const c = counts();
  const list = filteredPatients();

  app.innerHTML = `
    ${renderHeader()}
    ${renderStatusBanner()}
    ${renderAlerts(c)}
    ${renderStats(c)}
    <div class="panel">
      ${renderToolbar()}
      ${renderViewOnlyHint()}
      ${renderTable(list)}
      <div class="foot-note">${list.length} bệnh nhân hiển thị • Cập nhật lúc ${new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
  `;
  wireEvents();
  if(state.modal === 'form') renderFormModal();
  if(state.modal === 'delete') renderDeleteModal();
  if(state.modal === 'login') renderLoginModal();
  if(state.modal === 'export') renderExportModal();
}

function renderAlerts(c){
  const chips = [];
  if(c.over > 0) chips.push(`<button class="alert-chip over" data-quickfilter="over">${c.over} quá hạn</button>`);
  if(c.due > 0) chips.push(`<button class="alert-chip due" data-quickfilter="due">${c.due} hẹn hôm nay</button>`);
  if(c.soon > 0) chips.push(`<button class="alert-chip soon" data-quickfilter="soon">${c.soon} hẹn ngày mai</button>`);
  if(!chips.length) return '';
  return `<div class="alert-bar"><span class="alert-bar-label">${ICON.warn}Cần chú ý:</span>${chips.join('')}</div>`;
}

function renderStatusBanner(){

    {key:'upcoming', cls:'accent-warn', num:c.soon + c.due, lbl:'Cần nhắc', title:'Xem danh sách cần nhắc lịch'},

function renderTable(list){
  if(!dbReady){
    return `<div class="empty">Đang tải dữ liệu...</div>`;
  }
  if(dbError){
    return `<div class="empty">${ICON.warn}<b>Lỗi kết nối dữ liệu</b>${escapeHtml(dbError)}<div style="margin-top:12px;"><button class="btn sm" id="retry-db">Thử kết nối lại</button></div></div>`;
  }
  if(list.length === 0){
    return `<div class="empty">${ICON.inbox}<b>Không có bệnh nhân nào</b>Không tìm thấy dữ liệu phù hợp với bộ lọc hiện tại.</div>`;
  }
  const rows = list.map((p, idx) => {
    const st = p._status;
    const stLabel = st === 'over' ? 'Quá hạn' : st === 'due' ? 'Đến hẹn' : st === 'soon' ? 'Sắp đến hẹn' : 'Đang uống';
    return `
    <tr data-id="${p.id}">
      <td class="stt" data-label="STT"><span>${idx+1}</span></td>
      <td class="name" data-label="Họ và tên"><span>${escapeHtml(p.hoTen||'')}</span></td>
      <td data-label="Năm sinh"><span>${escapeHtml(p.namSinh||'')}</span></td>
      <td data-label="Giới tính"><span>${escapeHtml(p.gioiTinh||'')}</span></td>
      <td data-label="Chẩn đoán"><span class="badge-group">${loaiArray(p).map(c=>`<span class="badge ${categoryBadgeClass(c)}">${categoryLabel(c)}</span>`).join('')}</span></td>
      <td data-label="Thuốc"><span>${escapeHtml(p.thuoc||'')}</span></td>
      <td data-label="Nhà"><span>${escapeHtml(p.nha||'')}</span></td>
      <td data-label="Khu"><span>${escapeHtml(p.khu||'')}</span></td>
      <td data-label="Ngày khám"><span>${fmtDate(p.ngayKham)}</span></td>
      <td data-label="Ngày tái khám"><span>${fmtDate(p.ngayTaiKham)}</span></td>
      <td data-label="Trạng thái"><span class="status ${st}"><span class="dot"></span>${stLabel}</span></td>
      <td data-label="Thao tác">
        <div class="row-actions">
          ${state.isAdmin ? `
            <button class="icon-btn edit-btn" data-id="${p.id}" title="Sửa">${ICON.edit}</button>
            <button class="icon-btn del" data-id="${p.id}" title="Xoá (khi bệnh nhân ngừng điều trị)">${ICON.trash}</button>
          ` : '<span>—</span>'}
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="tbl-scroll">
    <table>
      <thead><tr>
        <th>STT</th><th>Họ và tên</th><th>Năm sinh</th><th>Giới tính</th><th>Chẩn đoán</th>
        <th>Thuốc</th><th>Nhà</th><th>Khu</th><th>Ngày khám</th><th>Ngày tái khám</th><th>Trạng thái</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

      <div class="modal-head"><h3>Đăng nhập Quản trị</h3><button class="close-x" id="modal-close">${ICON.x}</button></div>

        <div class="field">
          <label>Mật khẩu Admin</label>
          <div class="pw-row">

          </div>
        </div>
        <div class="err-txt">${state.loginError || ''}</div>
        <div class="lock-note">${ICON.info}<span>Quyền Admin cho phép thêm, sửa và xoá bệnh nhân. Người xem thường chỉ có thể xem và xuất báo cáo.</span></div>

        <button class="btn" id="modal-cancel">Huỷ</button>
        <button class="btn primary" id="pw-submit">Đăng nhập</button>
      </div>
    </div>
  `));
  document.body.appendChild(wrap);
  const pwInput = wrap.querySelector('#pw-input');
  const submit = () => {
    if(pwInput.value === ADMIN_PASSWORD){
      state.isAdmin = true;
      localStorage.setItem('cms_isAdmin','1');
      closeModal();
    }else{
      state.loginError = 'Mật khẩu không đúng. Vui lòng thử lại.';
      closeModal(false);
      render();
    }
  };
  wrap.querySelector('#pw-submit').addEventListener('click', submit);
  pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  wrap.querySelector('#modal-close').addEventListener('click', ()=>closeModal());
  wrap.querySelector('#modal-cancel').addEventListener('click', ()=>closeModal());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeModal(); });
}

              <button type="button" data-v="dm" class="chip ${selectedLoai.includes('dm')?'on':''}">Tiểu đường</button>
            </div>
            <div class="chip-hint">Có thể chọn nhiều loại nếu bệnh nhân mắc đồng thời (ví dụ vừa Tâm thần vừa Huyết áp).</div>
          </div>
          <div class="field full">
            <label>Thuốc</label>
            <input type="text" id="f-thuoc" value="${escapeAttr(p.thuoc||'')}" placeholder="Amlodipin 5mg">
          </div>
          <div class="field">
            <label>Nhà</label>
            <input type="text" id="f-nha" value="${escapeAttr(p.nha||'')}" placeholder="1">
          </div>
          <div class="field">
            <label>Khu</label>
            <input type="text" id="f-khu" value="${escapeAttr(p.khu||'')}" placeholder="1">
          </div>
          <div class="field">
            <label>Ngày khám</label>
            <input type="date" id="f-ngayKham" value="${p.ngayKham||''}">
          </div>
          <div class="field">
            <label>Ngày tái khám</label>
            <input type="date" id="f-ngayTaiKham" value="${p.ngayTaiKham||''}">
          </div>
        </div>
        <div class="err-txt" id="form-err">${state.formError||''}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="modal-cancel">Huỷ</button>
        <button class="btn primary" id="form-submit">${isEdit ? 'Lưu thay đổi' : 'Thêm bệnh nhân'}</button>
      </div>
    </div>
  `));
  document.body.appendChild(wrap);

  const chipGroup = wrap.querySelector('#f-loai-group');
  chipGroup.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.v;
      const idx = selectedLoai.indexOf(v);
      if(idx >= 0){ selectedLoai.splice(idx,1); b.classList.remove('on'); }
      else { selectedLoai.push(v); b.classList.add('on'); }
    });
  });

  wrap.querySelector('#modal-close').addEventListener('click', ()=>closeModal());
  wrap.querySelector('#modal-cancel').addEventListener('click', ()=>closeModal());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeModal(); });

  wrap.querySelector('#form-submit').addEventListener('click', async ()=>{
    const hoTen = wrap.querySelector('#f-hoTen').value.trim();
    if(!hoTen){
      wrap.querySelector('#form-err').textContent = 'Vui lòng nhập họ và tên.';
      return;
    }
    if(selectedLoai.length === 0){
      wrap.querySelector('#form-err').textContent = 'Vui lòng chọn ít nhất 1 loại bệnh.';
      return;
    }
    const data = {
      hoTen,
      namSinh: wrap.querySelector('#f-namSinh').value.trim(),
      gioiTinh: wrap.querySelector('#f-gioiTinh').value,
      loai: selectedLoai.slice(),
      thuoc: wrap.querySelector('#f-thuoc').value.trim(),
      nha: wrap.querySelector('#f-nha').value.trim(),
      khu: wrap.querySelector('#f-khu').value.trim(),
      ngayKham: wrap.querySelector('#f-ngayKham').value,
      ngayTaiKham: wrap.querySelector('#f-ngayTaiKham').value,
    };
    const btn = wrap.querySelector('#form-submit');
    btn.disabled = true; btn.textContent = 'Đang lưu...';
    try{
      await savePatient(data, isEdit ? state.editing.id : null);
      closeModal();
    }catch(e){
      console.error(e);
      wrap.querySelector('#form-err').textContent = 'Lưu thất bại. Vui lòng thử lại.';
      btn.disabled = false; btn.textContent = isEdit ? 'Lưu thay đổi' : 'Thêm bệnh nhân';
    }
  });
}

  let localKhu = state.khu;
  const wrap = el(`<div class="overlay" id="overlay"></div>`);
  wrap.appendChild(el(`
    <div class="modal modal-sm">
      <div class="modal-head"><h3>Xuất báo cáo Excel</h3><button class="close-x" id="modal-close">${ICON.x}</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label>Chọn Nhà để xuất</label>
            <select id="export-nha-select">
              <option value="all" ${localNha==='all'?'selected':''}>Tất cả các nhà</option>

          <div class="field">

            </select>

        </div>
        <div class="export-options">

          <button class="export-opt" id="export-bpdm">

  khuSelect.addEventListener('change', ()=>{ localKhu = khuSelect.value; });
  wrap.querySelector('#modal-close').addEventListener('click', ()=>closeModal());
  wrap.querySelector('#modal-cancel').addEventListener('click', ()=>closeModal());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeModal(); });
  wrap.querySelector('#export-mental').addEventListener('click', ()=>{ exportGroup('mental', nhaSelect.value, khuSelect.value); closeModal(); });
  wrap.querySelector('#export-bpdm').addEventListener('click', ()=>{ exportGroup('bpdm', nhaSelect.value, khuSelect.value); closeModal(); });
}

async function importFromFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
  let ok = 0, fail = 0;
  for(const r of rows){
    const hoTen = String(r['Họ và tên'] || r['Ho ten'] || r['Họ tên'] || '').trim();
    if(!hoTen){ fail++; continue; }
    const loaiRaw = String(r['Loại'] || r['Loai'] || r['Chẩn đoán'] || r['Chan doan'] || '').trim().toLowerCase();
    let loai = [];
    if(loaiRaw.includes('tâm thần') || loaiRaw.includes('tam than')) loai.push('mental');
    if(loaiRaw.includes('huyết áp') || loaiRaw.includes('huyet ap')) loai.push('bp');
    if(loaiRaw.includes('tiểu đường') || loaiRaw.includes('tieu duong') || loaiRaw.includes('đái tháo') || loaiRaw.includes('dai thao')) loai.push('dm');
    if(!loai.length) loai = ['bp'];
    const data = {
      hoTen,
      namSinh: String(r['Năm sinh'] || r['Nam sinh'] || '').trim(),
      gioiTinh: String(r['Giới tính'] || r['Gioi tinh'] || '').trim() || 'Nữ',
      loai,
      thuoc: String(r['Thuốc'] || r['Thuoc'] || '').trim(),
      nha: String(r['Nhà'] || r['Nha'] || '').trim(),
      khu: String(r['Khu'] || r['Khu vực'] || r['Khu vuc'] || '').trim(),
      ngayKham: parseAnyDate(r['Ngày khám'] || r['Ngay kham']),
      ngayTaiKham: parseAnyDate(r['Ngày tái khám'] || r['Ngay tai kham']),
    };
    try{ await savePatient(data, null); ok++; }
    catch(e){ console.error('import row failed', e); fail++; }
  }
  return { ok, fail, total: rows.length };
}

function renderDeleteModal(){
  const p = state.deleteTarget;
  const wrap = el(`<div class="overlay" id="overlay"></div>`);
  wrap.appendChild(el(`
    <div class="modal modal-sm">
      <div class="modal-head"><h3>Xoá bệnh nhân</h3><button class="close-x" id="modal-close">${ICON.x}</button></div>
      <div class="modal-body">
        <p style="margin:0 0 4px;">Bạn có chắc muốn xoá hồ sơ của <b>${escapeHtml(p?.hoTen||'')}</b>?</p>
        <p style="margin:0 0 4px;color:var(--muted);font-size:12.5px;">Dùng khi bệnh nhân đã ngừng điều trị hoặc không còn theo dõi nữa.</p>
        <p style="margin:0;color:var(--muted);font-size:12.5px;">Hành động này không thể hoàn tác.</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="modal-cancel">Huỷ</button>
        <button class="btn danger-txt" id="confirm-del" style="border-color:var(--danger);">Xoá</button>
      </div>
    </div>
  `));
  document.body.appendChild(wrap);
  wrap.querySelector('#modal-close').addEventListener('click', ()=>closeModal());
  wrap.querySelector('#modal-cancel').addEventListener('click', ()=>closeModal());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeModal(); });
  wrap.querySelector('#confirm-del').addEventListener('click', async ()=>{
    const btn = wrap.querySelector('#confirm-del');
    btn.disabled = true; btn.textContent = 'Đang xoá...';
    try{
      await deletePatient(p.id);
      closeModal();
    }catch(e){
      console.error(e);
      closeModal();
    }
  });
}

function closeModal(clearError=true){
  document.getElementById('overlay')?.remove();
  state.modal = null;
  state.editing = null;
  state.deleteTarget = null;
  if(clearError){ state.formError=''; state.loginError=''; }
  render();
}

/* ============================= EVENTS ============================= */
function wireEvents(){
  document.getElementById('btn-login')?.addEventListener('click', ()=>{ state.loginError=''; state.modal='login'; render(); });
  document.getElementById('hint-login')?.addEventListener('click', ()=>{ state.loginError=''; state.modal='login'; render(); });
  document.getElementById('btn-logout')?.addEventListener('click', ()=>{
    state.isAdmin = false; localStorage.removeItem('cms_isAdmin'); render();
  });
  document.getElementById('btn-add')?.addEventListener('click', ()=>{ state.editing=null; state.formError=''; state.modal='form'; render(); });

  document.getElementById('cat-select')?.addEventListener('change', (e)=>{ state.category = e.target.value; render(); });
  document.getElementById('status-select')?.addEventListener('change', (e)=>{ state.status = e.target.value; render(); });
  document.getElementById('nha-select')?.addEventListener('change', (e)=>{ state.nha = e.target.value; render(); });
  document.getElementById('khu-select')?.addEventListener('change', (e)=>{ state.khu = e.target.value; render(); });
  document.querySelectorAll('[data-quickfilter]').forEach(b=> b.addEventListener('click', ()=>{
    if(b.dataset.resetall){ state.category='all'; state.nha='all'; state.search=''; }
    state.status = b.dataset.quickfilter;
    window.scrollTo({top: 0, behavior:'smooth'});
    render();
  }));

  document.getElementById('export-toggle')?.addEventListener('click', ()=>{ state.modal='export'; render(); });

  document.getElementById('import-toggle')?.addEventListener('click', ()=>{
    document.getElementById('import-file-input')?.click();
  });
  document.getElementById('import-file-input')?.addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    state.importStatus = 'Đang nhập dữ liệu từ file, vui lòng đợi...';
    render();
    try{
      const result = await importFromFile(file);
      state.importStatus = `Đã nhập ${result.ok}/${result.total} bệnh nhân thành công` + (result.fail ? `, ${result.fail} dòng bị bỏ qua (thiếu họ tên hoặc lỗi).` : '.');
    }catch(err){
      console.error('import failed', err);
      state.importStatus = 'Nhập file thất bại. Kiểm tra lại định dạng file Excel/CSV.';
    }
    render();
  });
  document.getElementById('dismiss-status')?.addEventListener('click', ()=>{ state.importStatus=''; render(); });

  document.getElementById('retry-db')?.addEventListener('click', ()=>{ dbReady=false; dbError=null; render(); initDb(); });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.search = e.target.value; render(); });
    // restore focus/cursor after re-render
    searchInput.focus();
    const val = searchInput.value; searchInput.value=''; searchInput.value = val;
  }

  document.querySelectorAll('.edit-btn').forEach(b=> b.addEventListener('click', ()=>{
    const p = patients.find(x=>x.id===b.dataset.id);
    state.editing = p; state.formError=''; state.modal='form'; render();
  }));
  document.querySelectorAll('.icon-btn.del').forEach(b=> b.addEventListener('click', ()=>{
    const p = patients.find(x=>x.id===b.dataset.id);
    state.deleteTarget = p; state.modal='delete'; render();
  }));
}

/* ============================= UTIL ============================= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ============================= BOOT ============================= */
render();
initDb();
</script>
